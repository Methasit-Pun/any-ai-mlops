name: Scheduled MLOps run

# Requires these to be set in Settings > Secrets and variables > Actions:
#   secrets.DATABASE_URL          - read-only Postgres URL (same one any-ai-backend uses)
#   secrets.GOOGLE_API_KEY        - used by the Gemini judge in evaluate_quality.py
#   secrets.DAGSHUB_TOKEN         - DagsHub access token (Settings > User Settings > Tokens)
#   vars.MLFLOW_TRACKING_URI      - your DagsHub MLflow endpoint:
#                                     https://dagshub.com/<username>/<repo>.mlflow
#   vars.DAGSHUB_USERNAME         - your DagsHub username
#
# DagsHub setup (one-time):
#   1. Sign up at dagshub.com (free) and connect this GitHub repo
#   2. Generate an access token at dagshub.com/user/settings/tokens
#   3. Set the secrets/vars above in this repo's Settings > Secrets and variables > Actions
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ vars.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      CHECKPOINT_PATH: checkpoint.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # GitHub-hosted runners are ephemeral, so checkpoint.json (which tracks the
      # last-processed timestamp per agent, see mlops/checkpoint.py) wouldn't
      # persist across scheduled runs without this. restore-keys picks up the
      # most recent checkpoint- entry; a new key is cached at the end of every run.
      - uses: actions/cache@v4
        with:
          path: checkpoint.json
          key: mlops-checkpoint-${{ github.run_id }}
          restore-keys: |
            mlops-checkpoint-

      - run: python -m mlops.log_experiment

      - run: python -m mlops.evaluate_quality
